name = "spirituelebetekenis"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
run_worker_first = [
  "/sitemap*.xml",
  "/sitemap.xml",
  "/sitemap_index.xml",
  "/feed",
  "/feed/",
  "/bol",
  "/bol/",
  "/tekenszijnoveral",
  "/tekenszijnoveral/",
  "/hetlevendatjoupast",
  "/hetlevendatjoupast/",
  "/howtobetheloveyouseek",
  "/howtobetheloveyouseek/",
  "/trainingmanifesteren",
  "/trainingmanifesteren/",
  "/intuitie",
  "/intuitie/",
  "/mindfulleven",
  "/mindfulleven/",
]
